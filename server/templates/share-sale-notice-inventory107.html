<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Описи вложения ф.107</title>
  <style>
    @page { size: A4 landscape; margin: 6mm; }
    html, body { margin: 0; padding: 0; }
    body { font-family: "Times New Roman", serif; font-size: 7pt; line-height: 1.05; color: #111; }
    p { margin: 0 0 1.5pt; }
    .page-break { page-break-before: always; break-before: page; }
    .f107-sheet { width: 100%; page-break-after: always; break-after: page; }
    .f107-sheet:last-child { page-break-after: auto; break-after: auto; }
    .f107-sheet-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 4mm 0; border: none; }
    .f107-sheet-table > tbody > tr > td.f107-sheet-cell { width: 50%; vertical-align: top; border: none; padding: 0; }
    .f107-copy { width: 100%; font-size: 6.6pt; line-height: 1.05; }
    .f107-header { width: 100%; display: table; margin-bottom: 2pt; }
    .f107-logo { display: table-cell; width: 34%; height: 18pt; vertical-align: middle; font-weight: bold; font-size: 7pt; }
    .f107-logo img { max-width: 100%; max-height: 18pt; display: block; }
    .f107-header-text { display: table-cell; text-align: right; vertical-align: top; }
    .f107-title { text-align: center; font-weight: bold; font-size: 8pt; letter-spacing: .5pt; }
    .f107-mail-id { margin-bottom: 2pt; }
    table.inventory-107 { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 6.4pt; line-height: 1.05; }
    table.inventory-107 td, table.inventory-107 th { border: 1px solid #111; padding: 1.5pt; vertical-align: top; }
    table.inventory-107 th { text-align: center; font-weight: normal; }
    table.inventory-107 th:nth-child(1), table.inventory-107 td.f107-num { width: 7%; text-align: center; }
    table.inventory-107 th:nth-child(3), table.inventory-107 td.f107-count { width: 12%; text-align: center; }
    table.inventory-107 th:nth-child(4), table.inventory-107 td.f107-value { width: 19%; text-align: center; }
    .f107-signatures { margin-top: 3pt; }
    .f107-sign-line { text-align: center; margin-top: 4pt; }
  </style>
</head>
<body>
  <div class="ph-raw" data-ph="inventoriesHtml"></div>
</body>
</html>
