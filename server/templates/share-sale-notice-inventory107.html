<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Описи вложения ф.107</title>
  <style>
    @page { size: A4 landscape; margin: 6mm; }
    html, body { margin: 0; padding: 0; }
    body { font-family: "Times New Roman", serif; font-size: 7pt; line-height: 1.05; color: #111; }
    p { margin: 0 0 1.5pt; }
    .page-break { page-break-before: always; break-before: page; }
    .f107-sheet { width: 271.43mm; break-inside: avoid; page-break-inside: avoid; margin: 0 auto; }
    .f107-sheet-table { width: 271.43mm; table-layout: fixed; border-collapse: collapse; border: none; }
    .f107-sheet-table > tbody > tr > td { vertical-align: top; border: none; padding: 0; }
    .f107-sheet-left { width: 132.45mm; }
    .f107-sheet-gap { width: 6.33mm; }
    .f107-sheet-right { width: 132.64mm; }
    .f107-copy { width: 132.45mm; font-size: 7pt; line-height: 1.05; }
    .f107-title { text-align: center; font-weight: bold; font-size: 14pt; letter-spacing: .5pt; }
    .f107-mail-id { margin-bottom: 2pt; }
    table.inventory-107 { width: 126mm; border-collapse: collapse; table-layout: fixed; font-size: 7pt; line-height: 1.05; }
    table.inventory-107 td, table.inventory-107 th { border: 1px solid #111; padding: 1.2pt; vertical-align: top; }
    table.inventory-107 th { text-align: center; font-weight: normal; }
    table.inventory-107 th:nth-child(1), table.inventory-107 td.f107-num { width: 8mm; text-align: center; }
    table.inventory-107 th:nth-child(2), table.inventory-107 td.f107-name { width: 70.5mm; }
    table.inventory-107 th:nth-child(3), table.inventory-107 td.f107-count { width: 23.4mm; text-align: center; }
    table.inventory-107 th:nth-child(4), table.inventory-107 td.f107-value { width: 24.1mm; text-align: center; }
  </style>
</head>
<body>
  <div class="ph-raw" data-ph="inventoriesHtml"></div>
</body>
</html>
